version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: garmin_workouts_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: garmin_workouts
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - garmin_network

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    container_name: garmin_workouts_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/garmin_workouts
      SECRET_KEY: ${SECRET_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ENVIRONMENT: development
    volumes:
      - ../backend:/app/backend
      - ../workout_parser:/app/workout_parser
      - ../garmin_uploader:/app/garmin_uploader
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - garmin_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:

networks:
  garmin_network:
    driver: bridge
